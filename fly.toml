# Fly.io configuration
# Troque 'teste-eneagrama-alvaro' pelo nome do app que você quiser no Fly.io
app = 'teste-eneagrama-alvaro'
primary_region = 'gru'  # São Paulo (mais próximo do Brasil)

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[mounts]]
  source = 'eneagrama_data'
  destination = '/data'

[deploy]
  release_command = []

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
